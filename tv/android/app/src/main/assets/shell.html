<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>Lilin</title>
<!--
  Lilin's Android TV shell (tv/android). The app shows this page with the Lilin server as its address,
  then loads the TV app from the server: the same one the Samsung app runs (public/tv-rs: Rust drawing with
  WebGL). Before that,
  it gives them what the Samsung TV has and Android doesn't: an AVPlay-shaped player (the app's native one),
  tizen.application.exit and Samsung's key codes. It also asks for the server's address when the app was
  built without one, and offers the app's own updates.
-->
<style>
  /* The splash is drawn exactly where the TV app (Rust, public/tv-rs) draws its own, so the hand-over doesn't move
     a pixel: Lilin's ink room, the LiLiN wordmark in bone and the screen's red line under it. Font comes with the app. */
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 200 800;
    src: url("/fonts/bricolage-grotesque-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; color: #EFE8E1;
    font-family: system-ui, sans-serif; font-size: 30px; line-height: 1.3;
    background: radial-gradient(ellipse 1500px 700px at 50% -160px, #33202B 0%, rgba(51, 32, 43, 0) 100%), linear-gradient(#140A14, #0E070E); }
  /* A video is open: the page is see-through, so the picture under it shows (Samsung cuts a hole instead). */
  html.lil-video, html.lil-video body { background: transparent !important; }
  #app { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; }
  .shell { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .shell .wm { position: absolute; left: 833px; top: 416px; width: 254px; height: 123px; fill: #EFE8E1; }
  .shell i { position: absolute; left: 793px; top: 558px; width: 334px; height: 3px; border-radius: 2px; background: #FB2C16;
    box-shadow: 0 0 22px rgba(251, 44, 22, .45); }
  .shell p { position: absolute; left: 410px; width: 1100px; top: 640px; margin: 0; text-align: center; color: #B8AAB2; font-size: 32px; }
  .shell p:empty { display: none; }
  .shell p kbd { font: inherit; font-weight: 700; color: #EFE8E1; }

  /* Where is Lilin? (first start of an app built without an address) */
  .setup { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 0 40px 240px; }
  .setup .wm { width: 95px; height: 46px; fill: #EFE8E1; }
  .setup h1 { margin: 40px 0 0; font-family: "Bricolage Grotesque", sans-serif; font-size: 84px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .setup .lead { margin: 26px 0 0; max-width: 1180px; color: #B8AAB2; font-size: 34px; }
  .setup .lead b { color: #EFE8E1; }
  .setup form { display: flex; align-items: center; margin-top: 56px; }
  .setup input { width: 900px; height: 104px; padding: 0 44px; border-radius: 999px; border: 2px solid rgba(239, 232, 225, .1); outline: none;
    background: rgba(29, 18, 28, .9); color: #EFE8E1; font: 700 40px/1 system-ui, sans-serif; caret-color: #FB2C16;
    transition: transform .15s ease-out, box-shadow .15s ease-out; }
  .setup input::placeholder { color: rgba(184, 170, 178, .55); }
  .setup button { margin-left: 28px; height: 104px; padding: 0 60px; border-radius: 999px; border: 0; background: rgba(239, 232, 225, .08);
    color: #EFE8E1; font: 700 36px/1 system-ui, sans-serif; transition: transform .15s ease-out, background-color .15s ease-out; }
  .setup .focus { transform: scale(1.04); box-shadow: 0 0 0 5px #FB2C16, 0 0 44px rgba(251, 44, 22, .42); }
  .setup button.focus { background: #FB2C16; color: #140A14; box-shadow: 0 0 44px rgba(251, 44, 22, .42); }
  .setup .note { margin: 34px 0 0; min-height: 40px; font-size: 32px; color: #FF9B85; }
  .setup .note.busy { color: #B8AAB2; }

  /* The update offer, over whatever is showing (the TV app is a canvas underneath). */
  .lil-update { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(14, 7, 14, .94); }
  .lil-update .dialog-box { width: 920px; padding: 56px; border-radius: 30px; background: linear-gradient(#2A1C28, #1D121C);
    border: 2px solid rgba(239, 232, 225, .1); box-shadow: 0 40px 100px rgba(0, 0, 0, .6); }
  .lil-update h2 { margin: 0 0 36px; font-family: "Bricolage Grotesque", sans-serif; font-size: 46px; letter-spacing: -.02em; }
  .lil-update p { margin: -12px 0 30px; color: #B8AAB2; font-size: 32px; }
  .lil-update .choice { display: block; width: 100%; text-align: left; padding: 24px 34px; margin-top: 16px; border: 0; border-radius: 999px;
    background: rgba(239, 232, 225, .08); color: #EFE8E1; font: 700 32px/1.3 system-ui, sans-serif; }
  .lil-update .choice.focus { background: #FB2C16; color: #140A14; }
  .lil-update .bar { height: 12px; margin-top: 10px; border-radius: 6px; background: rgba(239, 232, 225, .1); overflow: hidden; }
  .lil-update .bar i { display: block; height: 100%; width: 0; background: #FB2C16; transition: width .3s linear; }
</style>
<script>
  window.LILIN_SERVER = "__LILIN_SERVER__";
  window.LILIN_BUILT_IN = "__LILIN_BUILT_IN__";
  // Swedish on a TV set to Swedish, English on every other (MainActivity passes the TV's language).
  window.LILIN_SWEDISH = "__LILIN_LANG__" === "sv";
  document.documentElement.lang = window.LILIN_SWEDISH ? "sv" : "en";
</script>
</head>
<body>
<div id="app"><div class="shell"><svg class="wm" viewBox="0 0 2098 1016" aria-label="Lilin"><path d="M0.0 0.0H242.0V22.0H0.0Z M46.0 0.0H196.0V1000.0H46.0Z M0.0 978.0H196.0V1000.0H0.0Z M196.0 970.0 L338.0 970.0 L420.0 850.0 L424.0 854.0 L424.0 1000.0 L196.0 1000.0Z M528.0 0.0H678.0V150.0H528.0Z M528.0 186.0H678.0V1000.0H528.0Z M482.0 978.0H724.0V1000.0H482.0Z M798.0 0.0H1040.0V22.0H798.0Z M844.0 0.0H994.0V1000.0H844.0Z M798.0 978.0H994.0V1000.0H798.0Z M994.0 970.0 L1136.0 970.0 L1218.0 850.0 L1222.0 854.0 L1222.0 1000.0 L994.0 1000.0Z M1326.0 0.0H1476.0V150.0H1326.0Z M1326.0 186.0H1476.0V1000.0H1326.0Z M1280.0 978.0H1522.0V1000.0H1280.0Z M1642.0 0.0H1678.0V1000.0H1642.0Z M1596.0 978.0H1724.0V1000.0H1596.0Z M1596.0 0.0H1732.0V22.0H1596.0Z M1642.0 0.0 L1792.0 0.0 L2052.0 1016.0 L1902.0 1016.0Z M2016.0 0.0H2052.0V1016.0H2016.0Z M1970.0 0.0H2098.0V22.0H1970.0Z"/></svg><i></i><p id="shell-note"></p></div></div>
<script>
(function () {
  'use strict';
  var N = window.LilinNative;
  if (!N) return;

  // ---------- the remote: Back and media keys come from the app with Samsung's codes ----------
  window.__mqKey = function (code) {
    var e = document.createEvent('Event');
    e.initEvent('keydown', true, true);
    Object.defineProperty(e, 'keyCode', { value: code });
    Object.defineProperty(e, 'which', { value: code });
    (document.activeElement || document.body).dispatchEvent(e);
    return 'ok';
  };

  // ---------- tizen.*: leaving the app; the media keys need no registering here ----------
  window.tizen = {
    application: { getCurrentApplication: function () { return { exit: function () { N.exit(); } }; } },
    tvinputdevice: { registerKey: function () {}, unregisterKey: function () {} },
  };

  // ---------- webapis.avplay, backed by the app's own player ----------
  // Positions arrive twice a second; between them the clock runs on here, so reading the time is free.
  var listener = {}, st, prep = null, seeks = {}, seekId = 0;
  function reset() { st = { ms: 0, at: 0, playing: false, dur: 0, state: 'NONE', tracks: [], audio: -1 }; prep = null; seeks = {}; }
  reset();
  function call(name, arg) {
    var f = listener[name];
    if (typeof f === 'function') { try { f(arg); } catch (err) { setTimeout(function () { throw err; }); } }
  }
  window.__mq = {
    handlers: {},
    ev: function (e) {
      var p;
      switch (e.t) {
        case 'prepared': st.dur = e.dur; st.state = 'READY'; p = prep; prep = null; if (p && p.ok) p.ok(); break;
        case 'time': case 'playing':
          st.ms = e.ms; st.at = Date.now(); st.playing = e.v;
          if (e.t === 'time') call('oncurrentplaytime', e.ms);
          break;
        case 'buffering': call(e.v ? 'onbufferingstart' : 'onbufferingcomplete'); break;
        case 'seeked': p = seeks[e.id]; delete seeks[e.id]; if (p && p.ok) p.ok(); break;
        case 'ended': st.playing = false; st.ms = st.dur; call('onstreamcompleted'); break;
        case 'error':
          st.playing = false;
          p = prep; prep = null;
          if (p && p.fail) p.fail(e.msg); else call('onerror', e.msg);
          break;
        case 'tracks': st.tracks = e.audio || []; st.audio = e.cur; break;
        default: if (__mq.handlers[e.t]) __mq.handlers[e.t](e);
      }
    },
  };
  var avplay = {
    open: function (url) { reset(); listener = {}; st.state = 'IDLE'; document.documentElement.classList.add('lil-video'); N.open(String(url)); },
    close: function () { reset(); document.documentElement.classList.remove('lil-video'); N.close(); },
    stop: function () { st.playing = false; st.state = 'IDLE'; N.stop(); },
    setListener: function (l) { listener = l || {}; },
    // Letterboxed inside this part of the 1920×1080 page (the whole screen unless the credits card moved it).
    setDisplayRect: function (x, y, w, h) { if (N.rect) N.rect(+x || 0, +y || 0, +w || 1920, +h || 1080); },
    setDisplayMethod: function () {},
    prepare: function () { N.prepare(); },
    prepareAsync: function (ok, fail) { prep = { ok: ok, fail: fail }; N.prepare(); },
    play: function () { st.state = 'PLAYING'; N.play(); },
    pause: function () { st.state = 'PAUSED'; st.ms = avplay.getCurrentTime(); st.at = Date.now(); st.playing = false; N.pause(); },
    seekTo: function (ms, ok, fail) {
      var id = ++seekId;
      seeks[id] = { ok: ok, fail: fail };
      st.ms = ms; st.at = Date.now();
      N.seek(ms, id);
    },
    getCurrentTime: function () {
      var ms = st.ms + (st.playing ? Date.now() - st.at : 0);
      return Math.round(st.dur ? Math.min(ms, st.dur) : ms);
    },
    getDuration: function () { return st.dur; },
    getState: function () { return st.state; },
    getTotalTrackInfo: function () {
      return st.tracks.map(function (t) {
        return { index: t.index, type: 'AUDIO', extra_info: JSON.stringify({ language: t.language || t.label || '', channels: t.channels || '', fourCC: t.codec || '' }) };
      });
    },
    getCurrentStreamInfo: function () { return st.audio >= 0 ? [{ index: st.audio, type: 'AUDIO' }] : []; },
    setSelectTrack: function (type, index) { if (type === 'AUDIO') { st.audio = index; N.selectAudio(index); } },
    setSilentSubtitle: function () {},
  };
  window.webapis = { avplay: avplay };
  // Which video to ask Lilin for: the Samsung app's own (HEVC) when this TV decodes it, else H.264 (Codecs.java).
  window.LILIN_TV_PLAY = N.playVariant();

  // ---------- loading the TV screens from the server (like tv/tizen/shell.js, but fetched side by side) ----------
  var server = String(window.LILIN_SERVER || '').replace(/\/+$/, '');
  var added = [], waiting = false, retryTimer = null;
  function say(en, sv) { return window.LILIN_SWEDISH ? sv : en; }
  function note(html) { var n = document.getElementById('shell-note'); if (n) n.innerHTML = html; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function add(el) { added.push(el); document.head.appendChild(el); }
  function retry() {
    if (waiting) return;
    added.forEach(function (el) { if (el.parentNode) el.parentNode.removeChild(el); });
    added = [];
    waiting = true;
    note(say('Can’t reach Lilin at ' + esc(server) + '. Is the server on? Trying again…<br>Press <kbd>OK</kbd> to change the address.',
      'Kan inte nå Lilin på ' + esc(server) + '. Är servern på? Försöker igen…<br>Tryck <kbd>OK</kbd> för att byta adress.'));
    retryTimer = setTimeout(function () { waiting = false; load(); }, 5000);
  }
  var WORDMARK = document.querySelector('.shell .wm').outerHTML;
  var started = false;
  function script(src, done) {
    var s = document.createElement('script');
    s.async = false; // downloaded together, run in this order
    s.src = src;
    s.onload = function () { done(null); };
    s.onerror = function () { done(new Error('failed')); };
    add(s);
  }
  function started1() { if (!started) { started = true; setTimeout(checkForUpdate, 4000); } }
  // The Rust app (what the Samsung app runs): /tv-rs/host.js starts /tv-rs/lilin_tv.wasm. Swedish TVs also get
  // /tv/sv.js, for this page's own lines (the update offer).
  function load() {
    var v = Date.now();
    if (window.LILIN_SWEDISH) script(server + '/tv/sv.js?v=' + v, function () { /* English if it fails */ });
    script(server + '/tv-rs/host.js?v=' + v, function (err) {
      if (err || !window.LilinTvHost) return retry();
      window.LilinTvHost.start({
        server: server, lang: window.LILIN_SWEDISH ? 'sv' : 'en', play: window.LILIN_TV_PLAY, android: true,
        onFail: retry,
      });
      started1();
    });
  }
  // While the server can't be reached: OK changes the address, Back leaves.
  document.addEventListener('keydown', function (e) {
    if (!waiting) return;
    if (e.keyCode === 10009 || e.keyCode === 8) N.exit();
    else if (e.keyCode === 13) { clearTimeout(retryTimer); waiting = false; setup(server); }
  });

  // ---------- where is Lilin? ----------
  function setup(current) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="setup">' + WORDMARK +
      '<h1>' + say('Where is Lilin?', 'Var finns Lilin?') + '</h1>' +
      '<p class="lead">' + say('Type the address of your Lilin server, for example <b>192.168.1.10:8080</b>. ' +
      'You’ll find it in Lilin on your phone under <b>Settings → Android TV</b>.',
      'Skriv adressen till din Lilin-server, till exempel <b>192.168.1.10:8080</b>. ' +
      'Du hittar den i Lilin på telefonen under <b>Inställningar → Android TV</b>.') + '</p>' +
      '<form novalidate><input type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" placeholder="192.168.1.10:8080">' +
      '<button type="submit">' + say('Connect', 'Anslut') + '</button></form><p class="note" role="status"></p></div>';
    var input = app.querySelector('input'), button = app.querySelector('button'), msg = app.querySelector('.note'), form = app.querySelector('form');
    input.value = current ? current.replace(/^http:\/\//, '') : '';
    var on = 0, busy = false;
    function paint() {
      input.classList.toggle('focus', on === 0);
      button.classList.toggle('focus', on === 1);
      (on === 0 ? input : button).focus();
    }
    function submit() {
      if (busy) return;
      if (!input.value.trim()) { msg.className = 'note'; msg.textContent = say('Type the address first.', 'Skriv in adressen först.'); on = 0; paint(); return; }
      busy = true;
      msg.className = 'note busy'; msg.textContent = say('Looking for Lilin…', 'Letar efter Lilin…');
      input.blur();
      N.setServer(input.value);
    }
    __mq.handlers.server = function (e) {
      busy = false;
      if (e.ok) return; // the app reloads this page with the new address
      msg.className = 'note';
      msg.textContent = e.problem === 'address' ? say('That doesn’t look like an address. Type, for example, 192.168.1.10:8080.', 'Det där ser inte ut som en adress. Skriv till exempel 192.168.1.10:8080.')
        : e.problem === 'not-lilin' ? say('Something answered there, but it wasn’t Lilin. Check the address and the port.', 'Något svarade där, men det var inte Lilin. Kolla adressen och porten.')
        : say('Found nothing at that address. Is the TV on the same network as Lilin, and is the server on?', 'Hittade inget på den adressen. Är TV:n på samma nätverk som Lilin, och är servern på?');
      on = 0; paint();
    };
    form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    document.addEventListener('keydown', function (e) {
      if (!document.body.contains(form)) return;
      var k = e.keyCode;
      if (k === 40) { on = 1; paint(); e.preventDefault(); }
      else if (k === 38 || (k === 37 && on === 1)) { on = 0; paint(); e.preventDefault(); }
      else if (k === 13 && on === 1) { submit(); e.preventDefault(); }
      else if (k === 10009) { e.preventDefault(); if (server) location.reload(); else N.exit(); }
    });
    paint();
  }

  // ---------- updates of the app itself ----------
  // The server tells which app version it has (/android.json). On Android 12+ the app updates itself
  // quietly once it may install apps (SelfUpdate.java); otherwise a newer one is offered once per start,
  // never in the middle of a video.
  function checkForUpdate() {
    fetch(server + '/android.json', { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (info) {
        if (!info || !(info.versionCode > N.versionCode())) return;
        // Android 12+ with Lilin allowed to install: it downloads by itself and installs once the app is left.
        if (N.updatesItself && N.updatesItself(info.versionCode)) return;
        (function offer() {
          if (document.documentElement.classList.contains('lil-video')) { setTimeout(offer, 30000); return; }
          offerUpdate(info);
        })();
      })
      .catch(function () { /* no update info: nothing to offer */ });
  }
  function offerUpdate(info) {
    // The TV app's Swedish lines (/tv/sv.js) on a Swedish TV, else English.
    var T = function (en) {
      var sv = window.LILIN_SWEDISH && window.LilinTvStrings && window.LilinTvStrings[en];
      var args = arguments, line = sv || en;
      return line.replace(/\{(\d)\}/g, function (m, i) { var a = args[+i + 1]; return a == null ? m : String(a); });
    };
    var el = document.createElement('div');
    el.className = 'lil-update';
    el.innerHTML = '<div class="dialog-box"><h2></h2><p></p><div class="acts"></div></div>';
    var title = el.querySelector('h2'), text = el.querySelector('p'), acts = el.querySelector('.acts');
    var buttons = [], on = 0, closeOnly = false;
    function choices(list) {
      acts.innerHTML = '';
      buttons = list.map(function (c) {
        var b = document.createElement('button');
        b.className = 'choice';
        b.textContent = c.label;
        b.act = c.act;
        acts.appendChild(b);
        return b;
      });
      on = 0; paint();
    }
    function paint() { buttons.forEach(function (b, i) { b.classList.toggle('focus', i === on); }); }
    function close() { document.removeEventListener('keydown', keys, true); delete __mq.handlers.update; if (el.parentNode) el.parentNode.removeChild(el); }
    function progress(pct) {
      acts.innerHTML = '<div class="bar"><i></i></div>';
      buttons = [];
      acts.querySelector('i').style.width = Math.max(0, pct) + '%';
    }
    function keys(e) {
      var k = e.keyCode;
      e.preventDefault();
      e.stopImmediatePropagation();
      if (k === 38 || k === 37) { on = Math.max(0, on - 1); paint(); }
      else if (k === 40 || k === 39) { on = Math.min(buttons.length - 1, on + 1); paint(); }
      else if (k === 13 && buttons[on]) buttons[on].act();
      else if (k === 10009 || k === 8 || k === 27) { if (buttons.length || closeOnly) close(); }
    }
    function ask() {
      title.textContent = T('A new version of the Lilin app is here');
      text.textContent = T('Version {0}. It takes about a minute.', info.versionName || info.versionCode);
      choices([{ label: T('Update now'), act: start }, { label: T('Later'), act: close }]);
    }
    function start() {
      title.textContent = T('Updating the Lilin app…');
      text.textContent = T('Getting the new version…');
      progress(0);
      N.update(info.apk || '/android.apk');
    }
    __mq.handlers.update = function (e) {
      if (e.s === 'progress') { var i = acts.querySelector('i'); if (i) i.style.width = e.pct + '%'; }
      else if (e.s === 'later') {
        title.textContent = T('The update is ready');
        text.textContent = T('It installs by itself when you leave Lilin. From now on the app keeps itself up to date.');
        choices([{ label: T('OK'), act: close }]);
      } else if (e.s === 'installing') { text.textContent = T('Confirm with Install on the screen that opens.'); progress(100); closeOnly = true; setTimeout(close, 1500); }
      else if (e.s === 'allow') {
        title.textContent = T('Let Lilin install its update');
        text.textContent = T('Turn on Lilin in the list that opened, then press Back. The update carries on by itself.');
        closeOnly = true;
      } else if (e.s === 'allow-manual') {
        title.textContent = T('Let Lilin install its update');
        text.textContent = T('In the TV’s settings, allow Lilin to install unknown apps (often under Device preferences → Security). Then update again.');
        choices([{ label: T('OK'), act: close }]);
      } else if (e.s === 'denied') {
        title.textContent = T('The update was not installed');
        text.textContent = T('Lilin wasn’t allowed to install apps. You can update next time the app starts.');
        choices([{ label: T('OK'), act: close }]);
      } else if (e.s === 'error') {
        title.textContent = T('The update didn’t download');
        text.textContent = T('Lilin will offer it again next time the app starts.');
        choices([{ label: T('OK'), act: close }]);
      }
    };
    document.addEventListener('keydown', keys, true);
    document.body.appendChild(el);
    ask();
  }

  if (!server) setup('');
  else load();
})();
</script>
</body>
</html>
