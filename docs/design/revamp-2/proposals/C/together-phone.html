<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposal C: Together (phone, member with email)</title>
<link rel="stylesheet" href="../../../../../public/style.css">
<link rel="stylesheet" href="mock.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 class="wordmark"><a href="#">Lilin</a></h1>
    <nav class="tabs" aria-label="Sections">
      <button class="tab"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M10 9.5v5l4-2.5z"/></svg><span>Discover</span></button>
      <button class="tab" aria-current="page"><svg viewBox="0 0 24 24"><path d="M5 10V7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5V10"/><path d="M3 18v-5.5a1.5 1.5 0 0 1 3 0V14h12v-1.5a1.5 1.5 0 0 1 3 0V18z"/><path d="M5 18v1.5M19 18v1.5"/></svg><span>Together</span><b class="tab-badge">1</b></button>
      <button class="tab"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 5l4 14.5"/></svg><span>Library</span></button>
      <button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn search-toggle"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
      <button class="news-btn"><span class="news-bulb"></span><span class="news-label">What’s new</span></button>
      <span class="mk-face e mk-me">E</span>
    </div>
  </div>
</header>

<main>
  <div class="mk-head">
    <h2 class="view-heading">Together</h2>
    <button class="chip"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Invite</button>
  </div>

  <div class="mk-ask">
    <span class="mk-face m" style="--sz:40px">M</span>
    <p>Max wants to be friends<small>@max</small></p>
    <button class="btn-primary">Accept</button>
    <button class="mk-x" aria-label="Not now"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <div class="mk-strip" aria-label="Friends">
    <span class="mk-pal"><span class="mk-face e">E</span>You</span>
    <span class="mk-pal"><span class="mk-face o live">O</span>Owner<small class="on">TV · 3</small></span>
    <span class="mk-pal"><span class="mk-face a">A</span>Alex</span>
    <span class="mk-pal"><span class="mk-face p">P</span>Robin</span>
    <span class="mk-pal"><span class="mk-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Add</span>
  </div>

  <div class="mk-h2"><span class="live-mark"></span><h3>On SEELE TV now</h3><button class="see-all">Guide</button></div>
  <div class="mk-rail">
    <button class="mk-chan"><span class="art" style="background-image:url(img/ch3.jpg)"><span class="mk-faces"><span class="mk-face o">O</span><span class="mk-face m">M</span></span></span><span class="nownext-channel">Films</span><b>Shutter Island</b><span class="bar"><i style="width:44%"></i></span><small>71 min left</small></button>
    <button class="mk-chan"><span class="art" style="background-image:url(img/ch1.jpg)"></span><span class="nownext-channel">Anime</span><b>NANA</b><span class="bar"><i style="width:22%"></i></span><small>19 min left</small></button>
    <button class="mk-chan"><span class="art" style="background-image:url(img/ch7.jpg)"></span><span class="nownext-channel">Sci-fi &amp; fantasy</span><b>Game of Thrones</b><span class="bar"><i style="width:88%"></i></span><small>6 min left</small></button>
  </div>

  <div class="mk-h2"><h3>Watch with someone</h3></div>
  <div class="mk-two">
    <button class="mk-tile"><span class="fan"><img src="img/p-beast.jpg" alt=""><img src="img/p-odyssey.jpg" alt=""></span><b>Pick together</b><small>Everyone swipes, the first shared yes wins</small></button>
    <button class="mk-tile"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span><b>Watch party</b><small>Start one now or plan it for later</small></button>
  </div>
  <div class="mk-party">
    <img src="img/w-odyssey.jpg" alt="">
    <p><span class="mk-when">Fri 20:00</span> · The Odyssey<small>Owner’s party · you and 2 more</small></p>
    <button class="chip">Join</button>
  </div>

  <div class="mk-h2"><h3>Moments</h3><button class="see-all">All</button></div>
  <div class="mk-moments">
    <div class="mk-moment"><span class="art" style="background-image:url(img/w-evildead.jpg)"><span class="dur">0:24</span><span class="mk-face o">O</span></span><span><span class="mk-dot"></span><b>From Owner</b> · Evil Dead Burn</span></div>
    <div class="mk-moment"><span class="art" style="background-image:url(img/ch5.jpg)"><span class="dur">0:12</span><span class="mk-face e">E</span></span><span><b>Yours</b> · The Rings of Power</span></div>
  </div>
</main>
</body>
</html>
